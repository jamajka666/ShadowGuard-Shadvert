name: CI

on:
  push:
    branches: [main, develop, 'ui/**', 'feature/**']
  pull_request:
    branches: [main, develop, 'ui/**']

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests (SSRF guard)
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
